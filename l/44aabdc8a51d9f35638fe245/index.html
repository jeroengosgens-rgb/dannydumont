<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d0f12">
<title>Lezer</title>
<style>html,body{height:100%;margin:0;background:#0d0f12;color:#cfd5db;font:16px -apple-system,system-ui,sans-serif}
#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}</style>
</head><body><div id="m">Laden…</div>
<script>
(async () => {
  const m = document.getElementById("m");
  try {
    const k = new URLSearchParams(location.search).get("k");
    if (!k) { m.textContent = "Deze link is niet compleet."; return; }
    const b = atob(k.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((k.length + 3) % 4));
    const raw = Uint8Array.from(b, c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const r = await fetch("d.bin?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const tot = +r.headers.get("content-length") || 0, rd = r.body.getReader(), delen = []; let n = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; delen.push(value); n += value.length;
      m.textContent = "Laden… " + (tot ? Math.min(99, Math.round(n * 100 / tot)) + "%" : Math.round(n / 1e6) + " MB"); }
    const buf = new Uint8Array(n); let o = 0; for (const d of delen) { buf.set(d, o); o += d.length; }
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) { m.textContent = "Kon de lezer niet openen (" + (e.message || e) + ")."; }
})();
</script></body></html>
